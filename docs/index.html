<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>StoryForge AI PWA</title>
</head>
<body>
<header class="topbar"><div><h1>StoryForge AI</h1><p>小說創作 × 中英對照 × AI 插圖</p></div><button id="installBtn" class="secondary hidden">加入主畫面</button></header>
<main class="container">
<section class="card">
<div class="section-head"><h2>AI 設定</h2><span id="statusBadge" class="badge">未測試</span></div>
<label>文字 AI</label><select id="textProvider"><option value="gemini">Gemini（免費方案優先）</option><option value="openai">OpenAI（需要 API 額度）</option></select>
<div id="geminiFields"><label>Gemini API Key</label><input id="geminiKey" type="password" placeholder="貼上 Google AI Studio API Key"><label>Gemini 文字模型</label><select id="geminiModel"><option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite（省資源）</option><option value="gemini-2.5-flash">Gemini 2.5 Flash（平衡）</option><option value="gemini-2.5-pro">Gemini 2.5 Pro（依帳號可用性）</option></select></div>
<div id="openaiFields" class="hidden"><label>OpenAI API Key</label><input id="openaiKey" type="password" placeholder="需要 OpenAI API 額度"><label>OpenAI 文字模型</label><select id="openaiModel"><option value="gpt-5.6-luna">GPT-5.6 Luna</option><option value="gpt-5.6-terra">GPT-5.6 Terra</option><option value="gpt-5.6-sol">GPT-5.6 Sol</option></select></div>
<label>插圖來源</label><select id="imageProvider"><option value="pollinations">免費實驗插圖（Pollinations）</option><option value="gemini">Gemini Image（需要付費層）</option><option value="openai">OpenAI Image（需要 API 額度）</option></select>
<div class="row"><button id="saveSettingsBtn">儲存設定</button><button id="testBtn" class="secondary">測試文字 AI</button></div>
<p class="hint">金鑰只存放在這台瀏覽器的 localStorage，不會寫入此網站檔案。</p><pre id="testResult" class="statusbox"></pre>
</section>
<section class="card"><h2>創作</h2><label>中文創作要求</label><textarea id="prompt" rows="5" placeholder="例如：寫一篇奇幻英文小說，主角在月夜森林遇到會說話的銀色狐狸。"></textarea><div class="grid2"><div><label>英文難度</label><select id="level"><option>A2</option><option selected>B1</option><option>B2</option><option>C1</option></select></div><div><label>篇幅</label><select id="length"><option value="short">短篇</option><option value="medium" selected>中篇</option><option value="long">長篇</option></select></div></div><button id="generateBtn" class="primary">生成英文小說 + 繁中翻譯</button><div id="loading" class="loading hidden">AI 正在創作...</div></section>
<section id="storyCard" class="card hidden"><div class="section-head"><h2 id="storyTitle">故事</h2><button id="saveStoryBtn" class="secondary">存入書架</button></div><h3>English</h3><article id="englishStory" class="story"></article><h3>繁體中文</h3><article id="chineseStory" class="story"></article><h3>下一步</h3><div id="choices" class="choice-list"></div><label>或自行輸入中文劇情方向</label><textarea id="continuePrompt" rows="3" placeholder="例如：讓主角跟著狐狸進入地下遺跡"></textarea><button id="continueBtn">接續故事</button><hr><div class="section-head"><h3>AI 插圖</h3><button id="imageBtn" class="secondary">生成插圖</button></div><div id="imageStatus" class="hint"></div><img id="storyImage" class="story-image hidden" alt="AI 生成故事插圖"></section>
<section class="card"><div class="section-head"><h2>書架</h2><button id="clearShelfBtn" class="danger">清空書架</button></div><div id="shelf"></div></section>
</main><footer>StoryForge AI PWA · 所有故事與設定預設保存在你的瀏覽器</footer><script src="app.js"></script></body></html>
