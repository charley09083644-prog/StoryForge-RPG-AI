name: Deploy StoryForge PWA
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/deploy-pwa.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static PWA
        shell: bash
        run: |
          mkdir -p public
          cat > /tmp/pwa.b64 <<'B64'

B64
          base64 --decode /tmp/pwa.b64 > /tmp/pwa.zip
          unzip -q /tmp/pwa.zip -d public
          test -s public/index.html
          test -s public/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
