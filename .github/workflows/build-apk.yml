name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore MainActivity.java
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/storyforge/rpg
          cat build/mainactivity.part00 build/mainactivity.part01 > build/MainActivity.full.b64
          base64 --decode build/MainActivity.full.b64 | gunzip > app/src/main/java/com/storyforge/rpg/MainActivity.java
          test -s app/src/main/java/com/storyforge/rpg/MainActivity.java
          grep -q "Google Gemini" app/src/main/java/com/storyforge/rpg/MainActivity.java
          wc -c app/src/main/java/com/storyforge/rpg/MainActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StoryForge-RPG-AI-v3.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
