name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore Android source
        shell: bash
        run: |
          base64 --decode build/storyforge-source.b64 > storyforge-source.zip
          unzip -q storyforge-source.zip
          test -f StoryForge_RPG_v3_Android/settings.gradle
          test -f StoryForge_RPG_v3_Android/app/src/main/java/com/storyforge/rpg/MainActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: StoryForge_RPG_v3_Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          ls -lh StoryForge_RPG_v3_Android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum StoryForge_RPG_v3_Android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StoryForge-RPG-AI-v3-debug
          path: StoryForge_RPG_v3_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
