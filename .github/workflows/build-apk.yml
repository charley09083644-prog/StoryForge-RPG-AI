name: Build StoryForge Android Beta
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore formal source
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/storyforge/storyai
          cat build/formal-main.part00 build/formal-main.part01 > build/formal-main.b64
          base64 --decode build/formal-main.b64 | gunzip > app/src/main/java/com/storyforge/storyai/MainActivity.java
          test -s app/src/main/java/com/storyforge/storyai/MainActivity.java
          grep -q "callGeminiText" app/src/main/java/com/storyforge/storyai/MainActivity.java
          grep -q "callGeminiImage" app/src/main/java/com/storyforge/storyai/MainActivity.java
          grep -q "callOpenAIText" app/src/main/java/com/storyforge/storyai/MainActivity.java

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StoryForge-AI-Android-beta1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
